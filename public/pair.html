<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STATUS KING • Pair</title>
<style>
:root{--bg:#0b0b12;--card:#14141f;--gold:#f5c542;--text:#f2f2f2;--mut:#9a9ab0}
@media (prefers-color-scheme: light){:root{--bg:#f3f3f8;--card:#fff;--text:#14141f;--mut:#666}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:16px}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--gold);border-radius:20px;padding:28px;text-align:center}
img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)}
h1{margin:14px 0 4px;color:var(--gold);letter-spacing:2px}
p{color:var(--mut);font-size:14px}
input,button{width:100%;padding:13px;border-radius:12px;font-size:16px;margin-top:12px;border:1px solid var(--gold)}
input{background:transparent;color:var(--text)}
button{background:var(--gold);color:#000;font-weight:700;cursor:pointer}
#code{font-size:28px;letter-spacing:3px;color:var(--gold);margin-top:18px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <img src="/logo.jpg" alt="STATUS KING">
  <h1>STATUS KING</h1>
  <p>Enter your WhatsApp number with country code</p>
  <input id="num" type="tel" placeholder="94712345678">
  <button id="go">Get Pair Code</button>
  <div id="code"></div>
  <p id="msg">WhatsApp → Linked Devices → Link with phone number</p>
</div>
<script>
const $=id=>document.getElementById(id);
$('go').onclick=async()=>{
  const n=$('num').value.replace(/\D/g,'');
  $('code').textContent='';$('msg').textContent='Generating…';
  try{
    const r=await fetch('/api/pair?number='+n);const d=await r.json();
    if(d.code){$('code').textContent=d.code;$('msg').textContent='Tap the code to copy, then enter it in WhatsApp.'}
    else $('msg').textContent='❌ '+d.error;
  }catch(e){$('msg').textContent='❌ Server error'}
};
$('code').onclick=()=>{navigator.clipboard?.writeText($('code').textContent.replace(/-/g,''));};
</script>
</body>
</html>
